<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>中国古代艺术巡礼 · 藏宝阁</title>


    <style>

        /* ==============================
           1. 全局设置
        ============================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            background-color: #ebd8b5;

            color: #2b1710;

            font-family:
                "Microsoft YaHei",
                "PingFang SC",
                "Noto Sans CJK SC",
                Arial,
                sans-serif;

        }


        img {

            display: block;

            max-width: 100%;

        }


        /*
            所有超链接文字默认黑色
        */

        a {

            color: #000000;

            text-decoration: none;

        }


        /*
            点击过以后仍然保持黑色
        */

        a:visited {

            color: #000000;

        }



        /* ==============================
           2. 整个网页主体
        ============================== */

        .page {

            width: min(1400px, 92%);

            margin: 0 auto;

            padding-bottom: 60px;

        }



        /* ==============================
           3. 页头
        ============================== */

        .site-header {

            padding-top: 28px;

            text-align: center;

        }


        .site-title {

            margin: 0 0 24px;

            font-family:
                "STKaiti",
                "KaiTi",
                "Kaiti SC",
                serif;

            font-size: clamp(36px, 5vw, 64px);

            font-weight: normal;

            letter-spacing: 0.18em;

            color: #542919;

        }



        /* 顶部大图 */

        .banner {

            width: 100%;

            overflow: hidden;

            border:

                1px solid
                rgba(89, 50, 28, 0.2);

            border-radius: 4px;

            box-shadow:

                0 8px 22px
                rgba(67, 37, 17, 0.12);

        }


        .banner img {

            width: 100%;

            height: auto;

        }



        /* ==============================
           4. 作品陈列大标题
        ============================== */

        .section-header {

            margin: 50px 0 32px;

            text-align: center;

        }


        .section-title {

            margin: 0;

            font-family:
                "STKaiti",
                "KaiTi",
                "Kaiti SC",
                serif;

            font-size: clamp(28px, 3vw, 40px);

            font-weight: normal;

            letter-spacing: 0.15em;

            color: #542919;

        }


        .section-title::after {

            content: "";

            display: block;

            width: 60px;

            height: 2px;

            margin: 14px auto 0;

            background-color: #895c3a;

        }



        /* ==============================
           5. 分类标题
        ============================== */

        .category-title {

            margin:

                55px 0
                28px;

            padding-bottom: 10px;

            border-bottom:

                1px solid
                rgba(89, 50, 28, 0.25);

            font-family:
                "STKaiti",
                "KaiTi",
                serif;

            font-size: 28px;

            font-weight: normal;

            color: #542919;

        }



        /* ==============================
           6. 普通作品画廊
        ============================== */

        .gallery {

            display: grid;

            grid-template-columns:

                repeat(
                    4,
                    minmax(0, 1fr)
                );

            gap:

                36px
                24px;

        }



        /* ==============================
           7. 单件作品
        ============================== */

        .artwork {

            margin: 0;

            display: flex;

            flex-direction: column;

            min-width: 0;

        }



        /*
            图片展示区域
        */

        .artwork-image {

            height: 330px;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 18px;

            overflow: hidden;

            background-color:

                rgba(
                    255,
                    250,
                    235,
                    0.25
                );

            border:

                1px solid
                rgba(89, 50, 28, 0.15);

            box-shadow:

                0 7px 16px
                rgba(67, 37, 17, 0.08);

            transition:

                transform 0.25s ease,
                box-shadow 0.25s ease;

        }



        /*
            鼠标移到图片上
        */

        .artwork-image:hover {

            transform:
                translateY(-4px);

            box-shadow:

                0 12px 24px
                rgba(67, 37, 17, 0.15);

        }



        /*
            图片保持原始比例
            不再强制拉伸
        */

        .artwork-image img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            transition:
                transform 0.3s ease;

        }



        .artwork-image:hover img {

            transform:
                scale(1.025);

        }



        /* ==============================
           8. 作品文字
        ============================== */

        .artwork figcaption {

            padding:

                16px 8px
                4px;

            text-align: center;

            line-height: 1.7;

        }



        .artwork-title {

            display: inline-block;

            font-size: 18px;

            font-weight: 600;

            /*
                href文字黑色
            */

            color: #000000;

            text-decoration: none;

        }



        /*
            已访问仍然是黑色
        */

        .artwork-title:visited {

            color: #000000;

        }



        /*
            鼠标放上去时变为棕色
        */

        .artwork-title:hover {

            color: #7b3f23;

            text-decoration: underline;

            text-underline-offset: 5px;

        }



        .artwork-meta {

            display: block;

            margin-top: 5px;

            color: #745543;

            font-size: 15px;

        }



        /* ==============================
           9. 横向画区域
           
           左边：横向作品
           右边：导航栏
        ============================== */

        .wide-area {

            display: grid;

            grid-template-columns:

                minmax(0, 1fr)
                190px;

            gap: 35px;

            align-items: start;

        }



        /*
            横向作品列表
        */

        .wide-gallery {

            display: flex;

            flex-direction: column;

            gap: 45px;

        }



        /*
            横向作品图片高度
        */

        .wide-gallery
        .artwork-image {

            height: 480px;

        }



        /* ==============================
           10. 右侧导航栏
        ============================== */

        .side-nav {

            position: sticky;

            top: 25px;

            padding:

                20px
                18px;

            background-color:

                rgba(
                    255,
                    248,
                    230,
                    0.55
                );

            border-left:

                3px solid
                #765139;

            box-shadow:

                0 5px 14px
                rgba(67, 37, 17, 0.08);

        }



        /*
            导航栏标题
        */

        .side-nav h3 {

            margin:

                0 0
                15px;

            padding-bottom: 10px;

            border-bottom:

                1px solid
                rgba(80, 50, 30, 0.25);

            font-family:
                "STKaiti",
                "KaiTi",
                serif;

            font-size: 23px;

            font-weight: normal;

            color: #2b1710;

        }



        /*
            导航链接
        */

        .side-nav a {

            display: block;

            padding:

                12px
                7px;

            /*
                导航文字也是黑色
            */

            color: #000000;

            font-size: 16px;

            border-bottom:

                1px solid
                rgba(80, 50, 30, 0.15);

            transition:

                background-color 0.2s ease,
                color 0.2s ease,
                padding-left 0.2s ease;

        }



        .side-nav a:visited {

            color: #000000;

        }



        /*
            鼠标放到导航上
        */

        .side-nav a:hover {

            color: #7b3f23;

            background-color:

                rgba(
                    100,
                    60,
                    30,
                    0.08
                );

            padding-left: 12px;

        }



        /* ==============================
           11. 页尾
        ============================== */

        footer {

            margin-top: 65px;

            padding-top: 22px;

            text-align: center;

            border-top:

                1px solid
                rgba(89, 50, 28, 0.2);

            color: #7a5a47;

            font-size: 14px;

        }



        /* ==============================
           12. 平板适配
        ============================== */

        @media
        (max-width: 1000px) {

            .gallery {

                grid-template-columns:

                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

            }


            .artwork-image {

                height: 360px;

            }


            .wide-area {

                grid-template-columns:

                    minmax(0, 1fr)
                    160px;

                gap: 22px;

            }


            .wide-gallery
            .artwork-image {

                height: 400px;

            }

        }



        /* ==============================
           13. 手机适配
        ============================== */

        @media
        (max-width: 650px) {

            .page {

                width: 94%;

            }


            .gallery {

                grid-template-columns:
                    1fr;

            }


            .artwork-image {

                height: 360px;

            }


            /*
                手机屏幕太窄时
                导航栏自动放到作品下面
            */

            .wide-area {

                grid-template-columns:
                    1fr;

            }


            .wide-gallery
            .artwork-image {

                height: 350px;

            }


            .side-nav {

                position: static;

                border-left: none;

                border-top:

                    3px solid
                    #765139;

            }


            .side-nav a {

                display: inline-block;

                margin-right: 10px;

                border-bottom: none;

            }

        }

    </style>

</head>



<body>


<main class="page">
